name: Valida contenuto

# Controlla content.json (e la coerenza con schema.md e index.html) a ogni push e pull request.
on:
  push:
  pull_request:

jobs:
  valida:
    name: Valida contenuto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controllo di content.json
        run: python3 scripts/validate_content.py content.json
